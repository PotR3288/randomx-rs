# Only rustfmt options that are STABLE on the current toolchain — anything else is
# ignored by `cargo fmt` on stable but applied on nightly, which would make local
# formatting and CI disagree. Keep this list toolchain-independent: if an option
# graduates to stable upstream, it may be added here (and the codebase reformatted).
use_small_heuristics = "default"
hard_tabs = false
max_width = 120
newline_style = "Native"
reorder_imports = true
reorder_modules = true
edition = "2018"
